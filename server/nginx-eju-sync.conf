# Add inside the existing `server { ... }` block for eju.utautai.org (HTTPS).
# Proxies only /api/v2/ to the sync server; everything else (static site,
# any existing /api/sync) stays as it is.
location /api/v2/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 2m;

    # The live stream (/api/v2/stream) must not be buffered or cut early
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
